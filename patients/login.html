<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — MEDICAL-CHAMPION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .login-shell{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); padding:20px;
  }
  .login-card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:36px 32px; width:100%; max-width:380px;
  }
  .login-brand{display:flex; align-items:center; gap:10px; margin-bottom:24px;}
  .login-brand .brand-mark{
    font-family:'IBM Plex Mono', monospace; font-weight:600;
    background:var(--accent); color:var(--primary-dark);
    width:36px; height:36px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; font-size:13px;
  }
  .login-brand span.title{font-family:'Fraunces', serif; font-size:17px; font-weight:600; color:var(--primary-dark);}
  .login-card h1{font-size:21px; margin-bottom:6px;}
  .login-sub{color:var(--ink-soft); font-size:13px; margin:0 0 24px;}
  .login-card .field{margin-bottom:14px;}
  .login-card label{font-size:12px; color:var(--ink-soft); font-weight:500; display:block; margin-bottom:5px;}
  .login-card input{
    width:100%; border:1px solid var(--line); border-radius:7px;
    padding:10px 12px; font-size:14px; font-family:inherit;
  }
  .login-card input:focus{outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary);}
  .login-btn{
    width:100%; background:var(--primary); color:#fff; border:none;
    border-radius:7px; padding:11px; font-size:14px; font-weight:600;
    font-family:inherit; cursor:pointer; margin-top:8px;
  }
  .login-btn:hover{background:var(--primary-dark);}
  .login-btn:disabled{opacity:0.6; cursor:default;}
  .login-status{font-size:12.5px; margin-top:14px; min-height:16px; text-align:center;}
  .login-status.err{color:var(--danger);}
  .login-status.ok{color:#1F7A4D;}
</style>
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark">MC</span>
      <span class="title">MEDICAL CHAMPION</span>
    </div>
    <h1>Staff sign in</h1>
    <p class="login-sub">Enter the credentials given to you by your administrator.</p>

    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="login-btn">Sign in</button>
      <p class="login-status" id="login-status"></p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="login.js"></script>
</body>
</html>
